{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow-lg">

            <div class="card-header bg-primary text-white text-center">

                <h3>User Login</h3>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label>Email</label>

                        <input type="email"
                               name="email"
                               class="form-control"
                               required>

                    </div>

                    <div class="mb-3">

                        <label>Password</label>

                        <input type="password"
                               name="password"
                               class="form-control"
                               required>

                    </div>

                    <button class="btn btn-primary w-100">

                        Login

                    </button>

                </form>

            </div>

            <div class="card-footer text-center">

                <a href="{{ url_for('auth_bp.forgot_password') }}">

                    Forgot Password?

                </a>

                <br><br>

                New User?

                <a href="{{ url_for('auth_bp.register') }}">

                    Register Here

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}

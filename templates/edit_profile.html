{% extends "base.html" %}

{% block title %}Edit Profile{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="card shadow-lg border-0">

        <div class="card-header bg-primary text-white">

            <h3>Edit Profile</h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">

                    <label class="form-label">Full Name</label>

                    <input
                        type="text"
                        name="full_name"
                        class="form-control"
                        value="{{ profile[0] }}"
                        required>

                </div>

                <div class="mb-3">

                    <label class="form-label">Phone</label>

                    <input
                        type="text"
                        name="phone"
                        class="form-control"
                        value="{{ profile[2] if profile[2] else '' }}">

                </div>

                <div class="mb-3">

                    <label class="form-label">Gender</label>

                    <select
                        name="gender"
                        class="form-select">

                        <option value="Male"
                        {% if profile[3]=="Male" %}selected{% endif %}>
                        Male
                        </option>

                        <option value="Female"
                        {% if profile[3]=="Female" %}selected{% endif %}>
                        Female
                        </option>

                        <option value="Other"
                        {% if profile[3]=="Other" %}selected{% endif %}>
                        Other
                        </option>

                    </select>

                </div>

                <div class="mb-3">

                    <label class="form-label">Age</label>

                    <input
                        type="number"
                        name="age"
                        class="form-control"
                        value="{{ profile[4] if profile[4] else '' }}">

                </div>

                <button
                    class="btn btn-success">

                    Save Changes

                </button>

                <a
                    href="{{ url_for('profile') }}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}

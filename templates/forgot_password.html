{% extends "base.html" %}

{% block title %}Forgot Password{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow-lg">

            <!-- Header -->

            <div class="card-header bg-warning text-dark text-center">

                <h3 class="mb-0">
                    🔐 Reset Password
                </h3>

            </div>


            <!-- Body -->

            <div class="card-body">

                <p class="text-muted text-center">

                    Enter your registered email and create
                    a new password.

                </p>


                <form
                    method="POST"
                    action="{{ url_for('auth_bp.forgot_password') }}"
                >

                    <!-- Email -->

                    <div class="mb-3">

                        <label
                            for="email"
                            class="form-label"
                        >
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter registered email"
                            required
                        >

                    </div>


                    <!-- New Password -->

                    <div class="mb-3">

                        <label
                            for="new_password"
                            class="form-label"
                        >
                            New Password
                        </label>

                        <input
                            type="password"
                            id="new_password"
                            name="new_password"
                            class="form-control"
                            placeholder="Enter new password"
                            minlength="6"
                            required
                        >

                    </div>


                    <!-- Confirm Password -->

                    <div class="mb-3">

                        <label
                            for="confirm_password"
                            class="form-label"
                        >
                            Confirm New Password
                        </label>

                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            class="form-control"
                            placeholder="Confirm new password"
                            minlength="6"
                            required
                        >

                    </div>


                    <!-- Reset Button -->

                    <button
                        type="submit"
                        class="btn btn-warning w-100"
                    >

                        🔑 Reset Password

                    </button>

                </form>

            </div>


            <!-- Footer -->

            <div class="card-footer text-center">

                <a
                    href="{{ url_for('auth_bp.login') }}"
                    class="text-decoration-none"
                >

                    ← Back to Login

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}

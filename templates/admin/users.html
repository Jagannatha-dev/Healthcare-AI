<!DOCTYPE html>
<html>

<head>

    <title>Users</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/admin.css') }}">

</head>

<body>

<div class="d-flex">

    <div class="sidebar">

        <h3 class="text-white text-center mt-3">
            Healthcare AI
        </h3>

        <hr>

        <a href="{{ url_for('admin.dashboard') }}">🏠 Dashboard</a>
        <a href="{{ url_for('admin.users') }}">👥 Users</a>
        <a href="{{ url_for('admin.predictions') }}">🩺 Predictions</a>
        <a href="{{ url_for('admin.datasets') }}">📁 Dataset Management</a>
        <a href="{{ url_for('admin.analytics') }}">📊 Analytics</a>
        <a href="{{ url_for('admin.logout') }}">🚪 Logout</a>

    </div>

    <div class="content">

        <h2>Registered Users</h2>

        <!-- Search -->
        <form method="GET" action="{{ url_for('admin.users') }}" class="mb-3">

            <div class="input-group">

                <input
                    type="text"
                    name="search"
                    class="form-control"
                    placeholder="Search by Name or Email"
                    value="{{ request.args.get('search','') }}">

                <button class="btn btn-primary">
                    Search
                </button>

            </div>

        </form>

        <table class="table table-bordered table-hover">

            <thead class="table-dark">

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody>

            {% for user in users %}

                <tr>

                    <td>{{ user[0] }}</td>
                    <td>{{ user[1] }}</td>
                    <td>{{ user[2] }}</td>
                    <td>{{ user[3] }}</td>
                    <td>{{ user[4] }}</td>
                    <td>{{ user[5] }}</td>

                    <td>

                        <a href="{{ url_for('admin.view_user', user_id=user[0]) }}"
                           class="btn btn-info btn-sm">
                            View
                        </a>

                        <a href="{{ url_for('admin.edit_user', user_id=user[0]) }}"
   class="btn btn-warning btn-sm">
    Edit
</a>

                        <a href="{{ url_for('admin.delete_user', user_id=user[0]) }}"
                           class="btn btn-danger btn-sm"
                           onclick="return confirm('Delete this user?')">
                            Delete
                        </a>

                    </td>

                </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Edit Dataset Row</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/admin.css') }}">

</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->

    <div class="sidebar">

        <h3 class="text-white text-center mt-3">
            Healthcare AI
        </h3>

        <hr>

        <a href="{{ url_for('admin.dashboard') }}">
            🏠 Dashboard
        </a>

        <a href="{{ url_for('admin.users') }}">
            👥 Users
        </a>

        <a href="{{ url_for('admin.predictions') }}">
            🩺 Predictions
        </a>

        <a href="{{ url_for('admin.datasets') }}">
            📁 Dataset Management
        </a>

        <a href="{{ url_for('admin.logout') }}">
            🚪 Logout
        </a>

    </div>


    <!-- Main Content -->

    <div class="content container-fluid">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h2>
                Edit Dataset Row
            </h2>

            <a
                href="{{ url_for(
                    'admin.view_dataset',
                    filename=filename
                ) }}"
                class="btn btn-secondary">

                ← Back

            </a>

        </div>


        <div class="card shadow">

            <div class="card-header bg-primary text-white">

                <strong>
                    {{ filename }}
                </strong>

            </div>


            <div class="card-body">

                <form
                    method="POST"
                    action="{{ url_for(
                        'admin.edit_dataset_row',
                        filename=filename,
                        row_index=row_index
                    ) }}"
                >

                    {% for column in columns %}

                    <div class="mb-3">

                        <label
                            for="field_{{ loop.index }}"
                            class="form-label">

                            <strong>
                                {{ column }}
                            </strong>

                        </label>

                        <input
                            type="text"
                            id="field_{{ loop.index }}"
                            name="{{ column }}"
                            class="form-control"
                            value="{{ row[column] if row[column] is not none else '' }}"
                        >

                    </div>

                    {% endfor %}


                    <div class="mt-4">

                        <button
                            type="submit"
                            class="btn btn-success">

                            💾 Save Changes

                        </button>


                        <a
                            href="{{ url_for(
                                'admin.view_dataset',
                                filename=filename
                            ) }}"
                            class="btn btn-secondary">

                            Cancel

                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>

</html>

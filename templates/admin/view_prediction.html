<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <title>Prediction Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-5">

<div class="card shadow">

    <div class="card-header bg-primary text-white">
        <h3>Prediction Details</h3>
    </div>

    <div class="card-body">

        <table class="table table-bordered">

            <tr>
                <th width="220">History ID</th>
                <td>{{ prediction[0] }}</td>
            </tr>

            <tr>
                <th>User Name</th>
                <td>{{ prediction[1] }}</td>
            </tr>

            <tr>
                <th>Email</th>
                <td>{{ prediction[2] }}</td>
            </tr>

            <tr>
                <th>Disease</th>
                <td>{{ prediction[3] }}</td>
            </tr>

            <tr>
                <th>Confidence</th>
                <td>{{ "%.2f"|format(prediction[4]) }}%</td>
            </tr>

            <tr>
                <th>Symptoms</th>
                <td>{{ prediction[5] }}</td>
            </tr>

            <tr>
                <th>Prediction Date</th>
                <td>{{ prediction[6] }}</td>
            </tr>

        </table>

        <a href="{{ url_for('admin.predictions') }}"
           class="btn btn-secondary">
            Back
        </a>

    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html>

<head>

    <title>Edit User</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-5">

<h2>Edit User</h2>

<form method="POST">

<div class="mb-3">
<label>Name</label>
<input type="text"
name="full_name"
class="form-control"
value="{{ user[1] }}"
required>
</div>

<div class="mb-3">
<label>Email</label>
<input type="email"
name="email"
class="form-control"
value="{{ user[2] }}"
required>
</div>

<div class="mb-3">
<label>Phone</label>
<input type="text"
name="phone"
class="form-control"
value="{{ user[3] }}"
required>
</div>

<div class="mb-3">
<label>Gender</label>

<select
name="gender"
class="form-control">

<option value="Male"
{% if user[4]=='Male' %}selected{% endif %}>
Male
</option>

<option value="Female"
{% if user[4]=='Female' %}selected{% endif %}>
Female
</option>

<option value="Other"
{% if user[4]=='Other' %}selected{% endif %}>
Other
</option>

</select>

</div>

<div class="mb-3">
<label>Age</label>
<input type="number"
name="age"
class="form-control"
value="{{ user[5] }}"
required>
</div>

<button class="btn btn-success">
Update User
</button>

<a href="{{ url_for('admin.users') }}"
class="btn btn-secondary">
Cancel
</a>

</form>

</body>
</html>
